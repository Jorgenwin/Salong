name: Install PostgreSQL dependency

on:
  push:
    branches:
      - feat/postgres-runtime
    paths:
      - tmp/install-pg.ready

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/postgres-runtime

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pg
        run: npm install pg@8 --save

      - name: Commit lockfile
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Add PostgreSQL driver"
          git push origin HEAD:feat/postgres-runtime
