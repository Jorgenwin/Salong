<title>Salong utleiestasjon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ECEFEB; --surface:#FFFFFF; --surface-2:#F4F6F3; --ink:#141A17; --muted:#56625C; --faint:#87928C; --rule:#DCE1DC;
  --accent:#1E5E4F; --accent-ink:#FFFFFF; --accent-soft:#DCEAE4;
  --amber:#A86E12; --amber-soft:#F5E8CF; --red:#B0403A; --red-soft:#F6DEDB; --blue:#35598A; --blue-soft:#DFE7F2; --violet:#654A8C; --violet-soft:#E8E1F2;
  --shadow:0 10px 30px rgba(20,26,23,.12);
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1311; --surface:#161C19; --surface-2:#1D2521; --ink:#E3EAE6; --muted:#9CAAA3; --faint:#728079; --rule:#29332E;
    --accent:#6FC2A6; --accent-ink:#0D1411; --accent-soft:#1A2F28;
    --amber:#E3B65E; --amber-soft:#382D18; --red:#EE8A83; --red-soft:#3A2120; --blue:#8FAEE0; --blue-soft:#1D2839; --violet:#B9A2DC; --violet-soft:#2A2238;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --surface:#161C19; --surface-2:#1D2521; --ink:#E3EAE6; --muted:#9CAAA3; --faint:#728079; --rule:#29332E;
  --accent:#6FC2A6; --accent-ink:#0D1411; --accent-soft:#1A2F28;
  --amber:#E3B65E; --amber-soft:#382D18; --red:#EE8A83; --red-soft:#3A2120; --blue:#8FAEE0; --blue-soft:#1D2839; --violet:#B9A2DC; --violet-soft:#2A2238;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.5}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.005em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num,td.n{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100%}
.side{position:sticky; top:env(safe-area-inset-top,0px); height:100vh; align-self:start; background:var(--surface); border-right:1px solid var(--rule); display:flex; flex-direction:column; padding:18px 12px; gap:18px; overflow-y:auto}
.brand{display:flex; flex-direction:column; gap:2px; padding:0 8px}
.brand b{font-family:var(--serif); font-size:26px; font-weight:700; letter-spacing:-.01em; line-height:1}
.brand span{font-size:11.5px; color:var(--muted)}
.nav{display:flex; flex-direction:column; gap:2px}
.nav .grp{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); padding:12px 10px 4px; font-weight:600}
.nav button{all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:7px; color:var(--muted); font-size:14px}
.nav button svg{width:17px; height:17px; flex:0 0 17px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent); color:var(--accent-ink)}
.nav .cnt{margin-left:auto; font-size:11px; font-weight:600; background:var(--red); color:#fff; border-radius:999px; padding:0 7px; line-height:18px}
.side-foot{margin-top:auto; font-size:11.5px; color:var(--faint); padding:0 8px; display:flex; flex-direction:column; gap:6px}
.mode{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600}
.mode i{width:8px; height:8px; border-radius:50%; background:var(--faint)}
.mode.live i{background:var(--accent)} .mode.demo i{background:var(--amber)}

.main{min-width:0; display:flex; flex-direction:column}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(8px); display:flex; align-items:center; gap:12px; padding:14px 28px; border-bottom:1px solid var(--rule)}
.top h1{font-size:22px; margin-right:auto}
.search{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:6px 10px; width:min(280px,40vw)}
.search svg{width:15px; height:15px; stroke:var(--faint); fill:none; stroke-width:2}
.search input{border:0; outline:0; background:transparent; width:100%}
.me{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.me img{width:28px; height:28px; border-radius:50%}
.view{padding:24px 28px 60px; display:flex; flex-direction:column; gap:22px; max-width:1400px; width:100%}

/* buttons */
.btn{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--rule); background:var(--surface); color:var(--ink); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13.5px; font-weight:500; white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--accent); padding:6px 8px}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px; font-size:12.5px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}

/* panels */
.grid{display:grid; gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:18px; display:flex; flex-direction:column; gap:12px; min-width:0}
.panel > header{display:flex; align-items:baseline; gap:4px 10px; justify-content:space-between; flex-wrap:wrap}
.panel h2{font-size:17px}
.panel .sub{font-size:12.5px; color:var(--muted)}
.kpi{display:flex; flex-direction:column; gap:6px}
.kpi .k{font-size:12px; color:var(--muted); letter-spacing:.02em}
.kpi .v{font-family:var(--serif); font-size:30px; font-weight:600; line-height:1.05; font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px; color:var(--muted)}
.meter{height:8px; background:var(--surface-2); border-radius:6px; overflow:hidden; border:1px solid var(--rule)}
.meter i{display:block; height:100%; background:var(--accent); border-radius:6px}
.eyebrow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600}

/* chips */
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; border-radius:999px; padding:1px 8px; line-height:18px; white-space:nowrap; background:var(--surface-2); color:var(--muted); border:1px solid var(--rule)}
.chip.ex{background:var(--amber-soft); color:var(--amber); border-color:transparent}
.chip.a{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.chip.b{background:var(--blue-soft); color:var(--blue); border-color:transparent}
.chip.c{background:var(--surface-2)}
.chip.red{background:var(--red-soft); color:var(--red); border-color:transparent}
.chip.amber{background:var(--amber-soft); color:var(--amber); border-color:transparent}
.chip.violet{background:var(--violet-soft); color:var(--violet); border-color:transparent}
.st{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600}
.st::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--c,var(--faint))}

/* lists */
.list{display:flex; flex-direction:column}
.li{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; padding:10px 2px; border-top:1px solid var(--rule); cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:500}
.li .s{font-size:12.5px; color:var(--muted)}
.dot{width:10px; height:10px; border-radius:50%; background:var(--c,var(--faint))}
.empty{color:var(--muted); font-size:13.5px; padding:10px 2px}

/* banner */
.banner{display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:var(--amber-soft); color:var(--ink); border-radius:10px; padding:10px 14px; font-size:13.5px}
.banner b{color:var(--amber)}
.banner.info{background:var(--accent-soft)}
.banner.info b{color:var(--accent)}

/* kanban */
.board{display:grid; grid-template-columns:repeat(7,minmax(210px,1fr)); gap:12px; overflow-x:auto; padding-bottom:8px; align-items:start}
.col{background:var(--surface-2); border:1px solid var(--rule); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:160px}
.col.over{outline:2px dashed var(--accent); outline-offset:-2px}
.col > header{display:flex; flex-direction:column; gap:2px; padding:2px 4px 6px; border-bottom:1px solid var(--rule)}
.col > header .st{font-size:12.5px}
.col > header span{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:10px 11px; display:flex; flex-direction:column; gap:5px; cursor:grab; box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.45}
.card .o{font-size:12px; color:var(--muted)}
.card .t{font-weight:600; font-size:13.5px; line-height:1.3}
.card .m{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; color:var(--muted)}
.card .f{display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:12.5px}
.card .f b{font-variant-numeric:tabular-nums; white-space:nowrap}
.card .stale{color:var(--red); font-size:11.5px; font-weight:600}
.card img.av{width:20px; height:20px; border-radius:50%}

/* tables */
.tbl{overflow-x:auto; border:1px solid var(--rule); border-radius:12px; background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:760px; font-size:13.5px}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--rule); vertical-align:middle}
th{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; background:var(--surface-2); white-space:nowrap; cursor:pointer; user-select:none}
th[aria-sort]::after{content:" ↓"; color:var(--accent)}
th[aria-sort="ascending"]::after{content:" ↑"}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.name{font-weight:600}
td .s{display:block; font-size:12px; color:var(--muted); font-weight:400}

/* filters */
.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; background:var(--surface)}
.seg button{all:unset; cursor:pointer; padding:6px 11px; font-size:13px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
select.in,input.in,textarea.in{background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:7px 10px; width:100%}
select.in:focus,input.in:focus,textarea.in:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent}
textarea.in{resize:vertical; min-height:90px; line-height:1.5}
.fsel{width:auto}
label.f{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); font-weight:500}
label.f > span{display:flex; justify-content:space-between}
.form{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.form .full{grid-column:1/-1}
.check{display:flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer}
.check input{accent-color:var(--accent); width:15px; height:15px}

/* drawer */
.scrim{position:fixed; inset:0; background:rgba(10,14,12,.35); z-index:40}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(600px,100%); background:var(--bg); z-index:41; box-shadow:var(--shadow); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer > header{display:flex; align-items:flex-start; gap:12px; padding:18px 20px 14px; border-bottom:1px solid var(--rule); background:var(--surface)}
.drawer > header h2{font-size:21px}
.drawer > header .o{font-size:13px; color:var(--muted)}
.drawer .body{overflow-y:auto; padding:18px 20px 40px; display:flex; flex-direction:column; gap:18px}
.x{all:unset; cursor:pointer; margin-left:auto; width:30px; height:30px; display:grid; place-items:center; border-radius:6px; color:var(--muted); font-size:20px}
.x:hover{background:var(--surface-2)}
.stagebar{display:flex; gap:3px; flex-wrap:wrap}
.stagebar button{all:unset; cursor:pointer; font-size:12px; padding:5px 9px; border-radius:6px; background:var(--surface); border:1px solid var(--rule); color:var(--muted)}
.stagebar button[aria-pressed="true"]{background:var(--c); color:#fff; border-color:var(--c)}
.timeline{display:flex; flex-direction:column}
.ev{display:grid; grid-template-columns:28px 1fr; gap:10px; padding:9px 0; border-top:1px solid var(--rule)}
.ev:first-child{border-top:0}
.ev .ic{width:28px; height:28px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; color:var(--muted)}
.ev .ic svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2}
.ev .w{font-size:12px; color:var(--faint)}
.ev.task.open .ic{background:var(--amber-soft); color:var(--amber)}
.ev.task.done p{text-decoration:line-through; color:var(--faint)}
.ai-out{white-space:pre-wrap; font-size:13.5px; background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:12px; min-height:60px}
.note{font-size:12.5px; color:var(--muted)}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:13.5px; z-index:60; box-shadow:var(--shadow)}

/* calendar */
.cal{overflow-x:auto; border:1px solid var(--rule); border-radius:12px; background:var(--surface)}
.cal table{min-width:1100px; table-layout:fixed; font-size:12px}
.cal th,.cal td{padding:0; border-right:1px solid var(--rule); text-align:center; cursor:default}
.cal th{background:var(--surface-2); padding:6px 0; letter-spacing:0; text-transform:none; font-size:11px}
.cal th.room,.cal td.room{width:150px; text-align:left; padding:0 10px; position:sticky; left:0; background:var(--surface); z-index:1; font-weight:600; font-size:12.5px}
.cal th.room{background:var(--surface-2)}
.cal td.room span{display:block; font-size:11px; color:var(--muted); font-weight:400}
.cal td.day{height:40px; cursor:pointer; position:relative}
.cal td.day:hover{background:var(--surface-2)}
.cal .we{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--surface-2) 5px 7px)}
.cal .bk{position:absolute; inset:5px 3px; border-radius:5px; display:grid; place-items:center; font-size:10.5px; font-weight:700; color:#fff; overflow:hidden}
.cal .bk.bekreftet{background:var(--accent); color:var(--accent-ink)}
.cal .bk.holdt{background:var(--amber)}
.cal .bk.tilbud,.cal .bk.visning,.cal .bk.dialog,.cal .bk.ny{background:transparent; border:1.5px dashed var(--blue); color:var(--blue)}
.cal tr.sep td{height:8px; background:var(--surface-2); border-right:0}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.legend i{display:inline-block; width:14px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}

/* charts */
.hbars{display:flex; flex-direction:column; gap:8px}
.hb{display:grid; grid-template-columns:110px 1fr 80px; gap:10px; align-items:center; font-size:12.5px}
.hb .l{color:var(--muted)}
.hb .t{height:12px; background:var(--surface-2); border-radius:4px; overflow:hidden}
.hb .t i{display:block; height:100%; background:var(--c,var(--accent)); border-radius:4px}
.hb b{text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.vbars{display:grid; grid-template-columns:repeat(12,1fr); gap:6px; align-items:end; height:130px; padding-top:18px}
.vb{display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; font-size:11px; color:var(--muted)}
.vb i{display:block; width:100%; max-width:30px; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px}
.vb b{font-size:11px; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}

/* calculators */
.calc{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px}
.ctrls{display:flex; flex-direction:column; gap:14px}
.ctrl{display:flex; flex-direction:column; gap:5px}
.ctrl label{display:flex; justify-content:space-between; gap:10px; font-size:13px; font-weight:500}
.ctrl label output{font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent)}
.ctrl input[type=range]{width:100%; accent-color:var(--accent)}
.ctrl small{font-size:11.5px; color:var(--muted)}
.big{font-family:var(--serif); font-size:36px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.kv{display:flex; flex-direction:column; gap:7px; font-size:13.5px}
.kv div{display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed var(--rule); padding-bottom:5px}
.kv b{font-variant-numeric:tabular-nums}
.kv .req{color:var(--amber); font-size:12px}
.tpl{display:flex; flex-direction:column; gap:10px}
.tpl pre{white-space:pre-wrap; font-family:var(--sans); font-size:13.5px; margin:0; background:var(--surface-2); border-radius:8px; padding:12px}

.cform{grid-template-columns:1fr 1fr 1fr 1fr auto; align-items:end}
@media (max-width:700px){ .cform{grid-template-columns:1fr 1fr} }
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g21{grid-template-columns:1fr} .g3{grid-template-columns:1fr 1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky; top:env(safe-area-inset-top,0px); height:auto; z-index:25; flex-direction:row; align-items:center; padding:8px 12px; overflow-x:auto; border-right:0; border-bottom:1px solid var(--rule); gap:10px}
  .brand span,.side-foot,.nav .grp{display:none}
  .brand b{font-size:20px}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap; padding:7px 9px}
  .top{position:static; padding:12px 16px; flex-wrap:wrap}
  .search{width:100%; order:3}
  .view{padding:18px 16px 50px}
  .g2,.g3,.calc,.form{grid-template-columns:1fr}
}
@media (max-width:520px){ .g4{grid-template-columns:1fr} .hb{grid-template-columns:90px 1fr 64px} }
@media (prefers-reduced-motion:no-preference){ .drawer{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px); opacity:.6} to{transform:none; opacity:1}} }
.prosp{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.prosp .pside{display:grid;gap:16px;min-width:0}
.prosp .det{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.prosp .li{cursor:pointer;grid-template-columns:auto 1fr auto}
.prosp .li.sel{background:var(--accent-soft)}
.prosp .li.dim{opacity:.55}
.pscore{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;color:var(--accent)}
.pscore.sm{font-size:14px;min-width:26px;text-align:right}
.pbox{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.det h3,.pbox h3{font-size:14px}
.det section{display:grid;gap:6px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;font-size:13.5px}
.kv>:nth-child(odd){color:var(--muted)}
.det a{overflow-wrap:anywhere}
.plist{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px}
@media(max-width:900px){.prosp{grid-template-columns:1fr}.prosp .det{position:static;max-height:none}}
/* ---------- polish v2 ---------- */
:root{--r:14px; --sh:0 1px 2px rgba(20,26,23,.05),0 6px 18px rgba(20,26,23,.04)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--sh:0 1px 2px rgba(0,0,0,.35)} }
:root[data-theme="dark"]{--sh:0 1px 2px rgba(0,0,0,.35)}
body{-webkit-font-smoothing:antialiased}
.btn{border-radius:9px; transition:border-color .12s,background .12s,filter .12s}
.btn.primary{font-weight:600}
/* shell */
.side{padding:20px 12px; gap:22px}
.brand b{font-size:28px}
.nav{gap:3px}
.nav .grp{padding:16px 10px 6px}
.nav button{font-weight:500; transition:background .12s,color .12s}
.nav button[aria-current="page"]{background:var(--accent-soft); color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}
.nav button[aria-current="page"] svg{stroke-width:2}
.top{padding:14px 32px; min-height:74px}
.ttl{margin-right:auto; display:flex; flex-direction:column; gap:2px; min-width:0}
.top h1{font-size:24px; margin:0; line-height:1.15}
#vd{font-size:13px; color:var(--muted)}
.view{margin:0 auto; max-width:1340px; padding:26px 32px 64px; gap:20px}
.view.in>*{animation:rise .22s ease-out both}
@keyframes rise{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .view.in>*{animation:none} }
/* panels */
.panel{border:0; box-shadow:0 0 0 1px var(--rule),var(--sh); border-radius:var(--r); padding:20px 22px; gap:14px}
.panel > header{padding-bottom:12px; border-bottom:1px solid var(--rule)}
.panel h2{font-size:17.5px}
.kpi{gap:8px}
.kpi .k{font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:600; color:var(--faint)}
.kpi .v{font-size:34px}
.meter{height:6px; border:0}
.banner{border-radius:12px; padding:12px 16px}
/* lists */
.li{padding:11px 8px; border-radius:0; transition:background .12s}
.li .t{font-weight:600}
.empty{padding:14px 2px}
/* tables */
.tbl{border:0; box-shadow:0 0 0 1px var(--rule),var(--sh); border-radius:var(--r)}
th,td{padding:11px 14px}
th{background:var(--surface)}
tbody tr{transition:background .12s}
/* kanban */
.board{gap:14px}
.col{background:color-mix(in srgb,var(--surface-2) 75%,transparent); border-radius:var(--r); padding:12px}
.card{border-color:transparent; border-radius:12px; box-shadow:0 0 0 1px var(--rule),var(--sh); transition:box-shadow .12s,transform .12s}
.card:hover{border-color:transparent; box-shadow:0 0 0 1.5px var(--accent),var(--sh); transform:translateY(-1px)}
/* drawer */
.drawer{width:min(640px,100%)}
.drawer > header{padding:20px 24px 16px}
.drawer > header h2{font-size:23px}
.drawer .body{padding:20px 24px 44px; gap:22px}
.drawer .body section > h3, .drawer .body .pbox h3{font-family:var(--sans); font-size:11px !important; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:10px !important}
/* prospektering */
.prosp{grid-template-columns:minmax(0,4fr) minmax(0,7fr); gap:20px}
.prosp .pside{gap:20px}
.prosp .det{top:90px; max-height:calc(100vh - 106px); padding:22px 26px; gap:16px}
.prosp .li.sel{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
.prosp .li.sel .pscore{color:var(--accent)}
.pscore{font-family:var(--serif)}
.pscore.sm{font-size:15px; min-width:30px; color:var(--muted)}
.panel > header.dh{display:flex; gap:16px; align-items:flex-start; justify-content:space-between; padding:0; border:0}
.dh-t{display:flex; flex-direction:column; gap:6px; min-width:0}
.dh h2{font-size:25px; line-height:1.15}
.score{flex:0 0 66px; height:66px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center}
.score b{font-family:var(--serif); font-size:25px; line-height:1}
.score span{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600}
.why{display:flex; flex-wrap:wrap; gap:6px}
.why span{font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; background:var(--surface-2); color:var(--muted); border:1px solid var(--rule)}
.lead{font-size:14.5px; line-height:1.6}
.abar{display:flex; flex-wrap:wrap; gap:8px; position:sticky; top:-22px; z-index:2; background:var(--surface); padding:12px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule)}
.dgrid{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:12px}
.pbox{border-radius:12px; padding:14px 16px; gap:8px}
.det h3,.pbox h3,.dx > summary{font-family:var(--sans); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600}
.pbox.hl{background:var(--accent-soft)}
.pbox.hl h3{color:var(--accent)}
.pbox.hl p{font-size:14.5px; line-height:1.55}
.quote{font-family:var(--serif); font-style:italic; font-size:15px; line-height:1.6}
.kv{gap:6px 14px}
.dx{border-top:1px solid var(--rule); padding-top:14px}
.dx > summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; user-select:none}
.dx > summary::-webkit-details-marker{display:none}
.dx > summary::before{content:""; width:6px; height:6px; border-right:1.6px solid currentColor; border-bottom:1.6px solid currentColor; transform:rotate(-45deg); transition:transform .15s; margin-left:2px}
.dx[open] > summary::before{transform:rotate(45deg)}
.dx > summary:hover{color:var(--ink)}
.dx > *:not(summary){margin-top:12px}
.dx p{line-height:1.6}
.cnt2{font-size:11px; letter-spacing:0; background:var(--surface-2); border-radius:999px; padding:0 7px; color:var(--muted)}
@media (max-width:1200px){ .dgrid{grid-template-columns:1fr} }
@media (max-width:900px){ .abar{position:static} }
@media (max-width:860px){
  .top{padding:12px 16px; min-height:0}
  #vd{display:none}
  .view{padding:18px 16px 50px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .panel{padding:16px}
  .prosp .det{top:auto; padding:18px}
}
.pbox{align-content:start}
.pbox .kv b{font-weight:500}
/* statistikk */
.stbar{gap:10px}
.up{color:var(--accent)} .down{color:var(--red)}
td .up,td .down{font-size:12.5px; white-space:nowrap}
.spark{width:84px; height:22px; display:block}
.spark polyline{fill:none; stroke:var(--accent); stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round}
.spark circle{fill:var(--accent)}
.ybars{display:flex; gap:10px; align-items:stretch; height:180px; padding-top:6px}
.yb{all:unset; cursor:pointer; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; font-size:12px; color:var(--muted); border-radius:8px; padding:4px 0}
.yb:hover{background:var(--surface-2)}
.yb i{display:block; width:70%; max-width:56px; background:var(--accent-soft); border-radius:5px 5px 0 0; min-height:2px}
.yb.on i{background:var(--accent)} .yb.on{color:var(--ink); font-weight:600}
.yb b{font-size:12px; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.sgb{all:unset; cursor:pointer; display:grid; grid-template-columns:130px 1fr 70px; gap:10px; align-items:center; font-size:12.5px; border-radius:6px; padding:2px 4px}
.sgb:hover{background:var(--surface-2)} .sgb.on{background:var(--accent-soft)}
.sgb .t{position:relative; height:12px; background:var(--surface-2); border-radius:4px; overflow:visible}
.sgb .t i{display:block; height:100%; background:var(--accent); border-radius:4px}
.sgb .t u{position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:var(--ink); opacity:.55}
.sgb b{text-align:right; font-variant-numeric:tabular-nums}
.seg .s{font-size:11px; opacity:.7; margin-left:3px}
th.n{text-align:right}
@media (max-width:860px){ .sgb{grid-template-columns:100px 1fr 60px} .ybars{height:150px} }
.filters select.in.fsel{width:auto}
/* ---------- v3: kunder, kundekort, tilbud, om ---------- */
.drawer{width:min(740px,100%)}
.kc-head{align-items:flex-start}
.kc-id{display:flex; flex-direction:column; gap:6px; min-width:0}
.kc-id h2{font-size:26px !important; line-height:1.15}
.kc-tabs{display:flex; gap:2px; padding:0 20px; background:var(--surface); border-bottom:1px solid var(--rule); overflow-x:auto}
.kc-tabs button{all:unset; cursor:pointer; padding:11px 12px 10px; font-size:13.5px; font-weight:500; color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap}
.kc-tabs button:hover{color:var(--ink)}
.kc-tabs button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}
.kc-tiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
.kc-tile{background:var(--surface); border-radius:12px; box-shadow:0 0 0 1px var(--rule); padding:12px 14px; display:flex; flex-direction:column; gap:3px; min-width:0}
.kc-tile .k{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); font-weight:600}
.kc-tile .v{font-family:var(--serif); font-size:24px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.kc-tile .d{font-size:12px; color:var(--muted)}
.kc-angle{background:var(--accent-soft); border-radius:12px; padding:14px 16px; display:grid; gap:6px}
.kc-angle .eyebrow{color:var(--accent)}
.kc-angle p{font-size:14.5px; line-height:1.55}
.kc-sec{display:grid; gap:10px; background:var(--surface); border-radius:12px; box-shadow:0 0 0 1px var(--rule); padding:14px 16px}
.kc-sec > h3{font-family:var(--sans) !important; font-size:11px !important; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600; margin:0 !important}
.kc-sec .li{padding:9px 4px}
.kc-task{cursor:pointer}
.kc-task input{width:16px; height:16px; accent-color:var(--accent)}
.kc-quote{margin:0; padding:4px 0 4px 16px; border-left:3px solid var(--accent); font-family:var(--serif); font-style:italic; font-size:15.5px; line-height:1.6; display:grid; gap:6px}
.kc-quote .eyebrow{font-style:normal; font-family:var(--sans)}
.kc-hist{line-height:1.65}
.kc-events{margin:0; padding:0; list-style:none; display:grid; gap:8px}
.kc-events li{position:relative; padding-left:18px; line-height:1.5; font-size:13.5px}
.kc-events li::before{content:""; position:absolute; left:2px; top:.55em; width:7px; height:7px; border-radius:2px; background:var(--accent)}
.kc-src{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:12.5px}
.kc-src a{background:var(--surface); border:1px solid var(--rule); border-radius:999px; padding:1px 9px; text-decoration:none}
.drawer .body{background:var(--bg)}
.strip{display:flex; flex-wrap:wrap; gap:6px 22px; font-size:13px; color:var(--muted); padding:0 2px}
.strip b{font-family:var(--serif); font-size:18px; color:var(--ink); margin-right:3px}
.tgl{all:unset; cursor:pointer; font-size:13px; padding:6px 11px; border-radius:8px; border:1px solid var(--rule); background:var(--surface); color:var(--muted)}
.tgl[aria-pressed="true"]{background:var(--amber-soft); color:var(--amber); border-color:transparent; font-weight:600}
.ktbl td .s.warn{color:var(--amber)}
.ktbl td:nth-child(2){white-space:nowrap}
/* tilbud */
.qwrap{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:20px; align-items:start}
.qside{position:sticky; top:90px; display:grid; gap:16px}
.stepn{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-family:var(--sans); font-size:12px; font-weight:700; margin-right:10px; vertical-align:2px}
.rcs{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.rc{all:unset; cursor:pointer; display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:10px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--rule); transition:box-shadow .12s,background .12s}
.rc:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.rc.on{background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent)}
.rc-n{font-weight:600; font-size:13.5px}
.rc-n i{font-style:normal; font-size:10.5px; font-weight:700; color:var(--accent); background:var(--surface); border-radius:999px; padding:0 6px; margin-left:4px}
.rc-c{font-size:12px; color:var(--muted)}
.rc b{font-size:13px; font-variant-numeric:tabular-nums; margin-top:2px}
.opt{display:flex; gap:12px; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:10px; background:var(--surface-2); flex-wrap:wrap}
.opt > div{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1}
.opt .s{font-size:12px; color:var(--muted)}
.opt.tg{cursor:pointer; justify-content:flex-start}
.opt.tg input{width:16px; height:16px; accent-color:var(--accent)}
.opt.tg.on{background:var(--accent-soft)}
.opt .pr{font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap}
.qdoc{gap:16px; border-top:4px solid var(--accent)}
.qd-head{display:grid; gap:4px}
.qd-head h2{font-size:22px !important}
.qd-room{display:flex; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:10px; background:var(--surface-2); font-size:13.5px}
.qd-room span{color:var(--muted)}
.qd-lines{min-width:0; font-size:13.5px}
.qd-lines td{padding:7px 0; border-bottom:1px dashed var(--rule)}
.qd-lines td.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:12px}
.qd-lines tfoot td{border-bottom:0; padding-top:12px; font-family:var(--serif); font-size:22px; font-weight:600}
.qd-lines tfoot tr.ser td{font-family:var(--sans); font-size:13.5px; font-weight:500; color:var(--muted); padding-top:2px}
.qd-mult{display:grid; gap:6px}
/* om */
.om-hero{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.om-hero h2{font-size:26px !important; line-height:1.25; max-width:34ch}
.om-hero .lead{max-width:70ch}
.flow{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; counter-reset:f}
.flow-s{all:unset; cursor:pointer; display:flex; flex-direction:column; gap:6px; padding:14px; border-radius:12px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--rule); position:relative}
.flow-s:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.flow-s svg{width:20px; height:20px; stroke:var(--accent); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.flow-s b{font-size:14px}
.flow-s span{font-size:12.5px; color:var(--muted); line-height:1.4}
.om-list{margin:0; padding-left:20px; display:grid; gap:10px; line-height:1.5}
.om-list b{font-weight:600}
.exnote{font-size:12px; color:var(--faint)}
@media (max-width:1100px){ .qwrap{grid-template-columns:1fr} .qside{position:static} }
@media (max-width:700px){ .kc-tiles{grid-template-columns:1fr 1fr} .kc-tabs{padding:0 10px} }
.opt > div.seg{flex-direction:row; flex:0 0 auto; gap:0}
.qside.free{position:static}
/* ---------- v4: husets profil ---------- */
:root{
  --bg:#F3F3EE; --surface:#FFFFFF; --surface-2:#F4F5F0; --ink:#1A1E17; --muted:#5B6256; --faint:#8A9085; --rule:#E1E3DA;
  --accent:#265B00; --accent-ink:#FFFFFF; --accent-soft:#E5EDDC;
  --amber:#94640F; --amber-soft:#F5EBD5; --red:#B03A33; --red-soft:#F7E1DE; --blue:#3B5A8A; --blue-soft:#E2E9F3; --violet:#6A4E8E; --violet-soft:#ECE6F3; --teal:#1E6C75; --teal-soft:#DCEDEF;
  --serif:"Newsreader", "Literata", Georgia, serif; --sans:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:8px; --sh:0 1px 2px rgba(26,30,23,.04),0 8px 24px rgba(26,30,23,.035);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F120D; --surface:#171B14; --surface-2:#1E231A; --ink:#E7EBE2; --muted:#A4AC9D; --faint:#7E8778; --rule:#2A3125;
  --accent:#9BCB6C; --accent-ink:#0F140A; --accent-soft:#1F2E14;
  --amber:#E0B45C; --amber-soft:#382D18; --red:#EE8A83; --red-soft:#3A2120; --blue:#8FAEE0; --blue-soft:#1D2839; --violet:#B9A2DC; --violet-soft:#2A2238; --teal:#6FC3CC; --teal-soft:#16302F; } }
:root[data-theme="dark"]{
  --bg:#0F120D; --surface:#171B14; --surface-2:#1E231A; --ink:#E7EBE2; --muted:#A4AC9D; --faint:#7E8778; --rule:#2A3125;
  --accent:#9BCB6C; --accent-ink:#0F140A; --accent-soft:#1F2E14;
  --amber:#E0B45C; --amber-soft:#382D18; --red:#EE8A83; --red-soft:#3A2120; --blue:#8FAEE0; --blue-soft:#1D2839; --violet:#B9A2DC; --violet-soft:#2A2238; --teal:#6FC3CC; --teal-soft:#16302F; }
body{font-size:14.5px; letter-spacing:.003em}
h1,h2,h3{font-weight:600; letter-spacing:-.01em}
.brand b{font-size:30px; font-weight:600}
.brand b em{font-style:italic; font-weight:400; color:var(--accent)}
.top h1{font-size:28px; font-weight:500}
.top{background:color-mix(in srgb,var(--bg) 90%,transparent)}
.btn{border-radius:6px}
.chip{border-radius:4px}
.seg{border-radius:6px}
.panel,.tbl,.kc-sec,.kc-tile,.qdoc{border-radius:var(--r)}
.panel h2{font-size:19px; font-weight:600}
th{background:var(--surface-2)}
.nav button{border-radius:6px}
/* fargede markører, som på jukselappen */
.kpi .k::before,.kc-tile .k::before,.kc-sec > h3::before{content:""; display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--c,var(--accent)); margin-right:8px; vertical-align:1px}
.grid > .kpi:nth-child(6n+1){--c:var(--accent)} .grid > .kpi:nth-child(6n+2){--c:var(--blue)} .grid > .kpi:nth-child(6n+3){--c:var(--amber)}
.grid > .kpi:nth-child(6n+4){--c:var(--violet)} .grid > .kpi:nth-child(6n+5){--c:var(--red)} .grid > .kpi:nth-child(6n+6){--c:var(--teal)}
.kc-tile:nth-child(1){--c:var(--accent)} .kc-tile:nth-child(2){--c:var(--blue)} .kc-tile:nth-child(3){--c:var(--amber)} .kc-tile:nth-child(4){--c:var(--violet)}
.kpi .v,.kc-tile .v,.strip b{font-weight:500}
.sgb:nth-child(6n+2) .t i{background:var(--blue)} .sgb:nth-child(6n+3) .t i{background:var(--amber)} .sgb:nth-child(6n+4) .t i{background:var(--violet)} .sgb:nth-child(6n+5) .t i{background:var(--teal)} .sgb:nth-child(6n+6) .t i{background:var(--red)}
.meter i{background:var(--accent)}
.om-hero{background:linear-gradient(120deg,var(--accent-soft),var(--surface) 65%)}
.om-hero h2{font-weight:500}
.om-hero h2 em{color:var(--accent)}
.flow-s:nth-child(2) svg{stroke:var(--blue)} .flow-s:nth-child(3) svg{stroke:var(--violet)} .flow-s:nth-child(4) svg{stroke:var(--amber)} .flow-s:nth-child(5) svg{stroke:var(--teal)} .flow-s:nth-child(6) svg{stroke:var(--red)}
.qdoc{border-top-color:var(--accent)}
.kc-quote{border-left-color:var(--amber)}
.kc-events li::before{background:var(--amber)}
.why span{border-radius:4px}
/* kundekort: forbruk per år */
.kc-bars{display:flex; gap:8px; align-items:stretch; height:150px}
.kc-bar{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:3px; font-size:11.5px; color:var(--muted)}
.kc-bar i{display:block; width:72%; max-width:46px; min-height:2px; background:var(--teal-soft); border-radius:3px 3px 0 0; box-shadow:inset 0 2px 0 var(--teal)}
.kc-bar.now i{background:var(--teal); opacity:.55}
.kc-bar:nth-last-child(2) i{background:var(--teal)}
.kc-bar b{font-size:11.5px; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.kc-bar small{font-size:10.5px; color:var(--faint); min-height:14px}
/* prospekter: finn nye */
.ptabs{align-self:flex-start}
.gen{display:grid; gap:20px}
.gcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px}
.gcard{background:var(--surface); border-radius:var(--r); box-shadow:0 0 0 1px var(--rule),var(--sh); padding:18px 20px; display:grid; gap:12px; align-content:start; border-top:3px solid var(--violet)}
.gcard h3{font-size:19px; margin-top:4px}
.gcard p{line-height:1.55}
.chip.violet{background:var(--violet-soft); color:var(--violet); border-color:transparent}
/* ================= v5: produksjonsklar finpuss ================= */
:root{
  --bg:#F1F0EA; --surface:#FFFFFF; --surface-2:#F6F6F2; --sel:#EEF3E8; --ink:#1A1E17; --muted:#50574C; --faint:#666D62; --rule:#DEDFD6; --rule-2:#C9CBC0;
  --accent:#265B00; --accent-ink:#FFFFFF; --accent-soft:#E6EEDD;
  --info:#2F5A8F; --info-soft:#E4ECF6; --warn:#8A5A06; --warn-soft:#F7EDD8; --danger:#A8322B; --danger-soft:#F8E3E0;
  --amber:var(--warn); --amber-soft:var(--warn-soft); --red:var(--danger); --red-soft:var(--danger-soft); --blue:var(--info); --blue-soft:var(--info-soft);
  --r:6px; --r-sm:4px; --sh:none; --sh-el:0 12px 40px rgba(26,30,23,.16);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F120D; --surface:#171B14; --surface-2:#1C2119; --sel:#1F2B16; --ink:#E7EBE2; --muted:#B0B8A9; --faint:#9AA293; --rule:#2B3226; --rule-2:#3A4234;
  --info:#8FB0E3; --info-soft:#1C2738; --warn:#E3B560; --warn-soft:#352A15; --danger:#F0908A; --danger-soft:#3A201E; --sh-el:0 12px 40px rgba(0,0,0,.5); } }
:root[data-theme="dark"]{ --bg:#0F120D; --surface:#171B14; --surface-2:#1C2119; --sel:#1F2B16; --ink:#E7EBE2; --muted:#B0B8A9; --faint:#9AA293; --rule:#2B3226; --rule-2:#3A4234;
  --info:#8FB0E3; --info-soft:#1C2738; --warn:#E3B560; --warn-soft:#352A15; --danger:#F0908A; --danger-soft:#3A201E; --sh-el:0 12px 40px rgba(0,0,0,.5); }
body{font-size:14px; line-height:1.45; background:var(--bg)}
/* typografi: seriff for sidetitler og store seksjoner, sans for alt operativt */
.top h1{font-size:26px; font-weight:500; letter-spacing:-.015em}
.panel h2,.dbody h2{font-family:var(--serif); font-size:18px; font-weight:600}
.kc-id h2{font-size:26px !important; font-weight:600}
.li .t,.card .t,td.name{font-family:var(--sans); font-weight:600; font-size:13.5px}
.li .s,.card .o,.card .m,.meta,.note,td .s{font-size:12.5px; color:var(--muted)}
.meta{color:var(--muted)}
.eyebrow,.kpi .k,.kc-tile .k,th,.kstrip dt,.qg h3,.kc-sec>h3{font-family:var(--sans); font-size:11px; letter-spacing:.07em; text-transform:uppercase; font-weight:600; color:var(--muted)}
.kpi .v,.kc-tile .v,.strip b,.big,.qd-lines tfoot td,.kstrip dd,.score b,.sx-n,.pscore{font-family:var(--sans) !important; font-variant-numeric:tabular-nums}
.chip{font-size:11.5px; font-weight:600; border-radius:var(--r-sm); padding:0 7px; line-height:19px}
/* flater: bakgrunn, arbeidsflate, løftet/valgt */
.panel{box-shadow:none !important; border:1px solid var(--rule); border-radius:var(--r); padding:16px 18px; gap:12px}
.panel>header{padding-bottom:8px; border-bottom:1px solid var(--rule)}
.panel.quiet{background:transparent; border-color:transparent; padding:6px 2px}
.panel.quiet>header{border-bottom-color:var(--rule)}
.tbl{box-shadow:none !important; border:1px solid var(--rule); border-radius:var(--r)}
.drawer{box-shadow:var(--sh-el); background:var(--surface)}
.drawer .body{background:var(--surface)}
.view{gap:16px; padding:20px 28px 56px}
.side{background:var(--surface-2)}
/* tetthet */
.li{padding:8px 6px; gap:10px}
th,td{padding:8px 12px}
table{font-size:13.5px}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--sel); box-shadow:inset 3px 0 0 var(--accent)}
.tbl.sticky{max-height:68vh; overflow:auto}
.tbl.sticky th{position:sticky; top:0; z-index:2; background:var(--surface-2); box-shadow:0 1px 0 var(--rule)}
td.n,th.n,.n{text-align:right; font-variant-numeric:tabular-nums}
table.dense{width:100%; min-width:0; border-collapse:collapse; font-size:13px}
table.dense th,table.dense td{padding:6px 8px; border-bottom:1px solid var(--rule); text-align:left}
table.dense th{position:static; background:transparent}
/* fokus og tilgjengelighet */
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
/* kompakt nøkkeltallsrad */
.kstrip{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin:0; border:1px solid var(--rule); border-radius:var(--r); background:var(--surface)}
.kstrip.s6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kstrip>div{padding:10px 14px; border-left:1px solid var(--rule); min-width:0}
.kstrip>div:first-child{border-left:0}
.kstrip dd{margin:3px 0 0; font-size:20px; font-weight:600; line-height:1.15; display:flex; flex-direction:column; gap:2px}
.kstrip dd small{font-size:12px; font-weight:400; color:var(--muted); line-height:1.35}
.kstrip.in{border:0; background:transparent}
.kstrip.in>div{padding:6px 12px 6px 0; border-left:0}
.kpi .k::before,.kc-tile .k::before{display:none}
/* I dag */
.today-h h2{font-size:24px}
.over-t{color:var(--danger); font-weight:600}
.today{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:16px; align-items:start}
.side-col{display:grid; gap:16px}
.queue{border-top:3px solid var(--accent)}
.qg{display:grid; gap:2px}
.qg+.qg{margin-top:6px}
.qg h3{display:flex; align-items:center; gap:8px; padding:6px 0 4px}
.qg.g-over h3{color:var(--danger)}
.cnt3{font-size:11px; font-weight:600; background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r-sm); padding:0 6px; color:var(--muted); letter-spacing:0; text-transform:none}
.li.q{border-top:1px solid var(--rule)}
.li.q input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent)}
.li.q.over{box-shadow:inset 3px 0 0 var(--danger)}
.due{font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap}
.due.over{color:var(--danger)}
.due.warn{color:var(--warn)}
/* lagrestatus */
.sync{position:relative; font-size:12.5px}
.sync-b{all:unset; cursor:pointer; display:flex; align-items:flex-start; gap:8px; padding:6px 8px; border-radius:var(--r); line-height:1.35}
.sync-b:hover,.sync-b:focus-visible{background:var(--surface)}
.sync-b i{flex:0 0 8px; width:8px; height:8px; border-radius:50%; margin-top:5px; background:var(--faint)}
.sync.ok .sync-b i{background:var(--accent)} .sync.saving .sync-b i{background:var(--info); animation:pulse 1s infinite}
.sync.offline .sync-b i{background:var(--warn)} .sync.error .sync-b i{background:var(--danger)} .sync.error .sync-b{color:var(--danger); font-weight:600}
@keyframes pulse{50%{opacity:.35}}
.sync-p{position:absolute; bottom:100%; left:0; width:260px; background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--r); box-shadow:var(--sh-el); padding:12px; display:grid; gap:8px; z-index:50; color:var(--ink)}
.sync-p ul{margin:0; padding-left:16px; font-size:12px; color:var(--muted)}
.side-foot{gap:8px}
/* meldinger */
.notice{border-radius:var(--r); padding:10px 12px; display:grid; gap:6px; font-size:13.5px; border:1px solid}
.notice.info{background:var(--info-soft); border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.notice.warn{background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.notice.err{background:var(--danger-soft); border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.notice.ok{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.cmp{width:100%; min-width:0; font-size:12.5px; border-collapse:collapse} .cmp th,.cmp td{padding:4px 6px; border-bottom:1px solid var(--rule); background:transparent; text-align:left}
.ok-t{color:var(--accent); font-weight:600}
/* kundekort */
.kc-head{position:relative}
.kc-act{margin-top:6px}
.kc-id .meta{font-size:12.5px}
.kc-tabs{position:sticky; top:0; z-index:3}
.drawer .body{gap:0; padding:4px 24px 40px}
.kc-sec{background:transparent !important; box-shadow:none !important; border-radius:0; padding:14px 0; border-top:1px solid var(--rule); gap:8px}
.kc-sec:first-child{border-top:0}
.kc-sec>h3{display:flex; align-items:center; gap:8px}
.kc-sec .li.q:first-child{border-top:0}
.kc-rec{margin:4px 0 14px; padding:10px 12px 12px; border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent); border-radius:var(--r); background:color-mix(in srgb,var(--accent-soft) 50%,var(--surface)); display:grid; gap:6px}
.rec-h{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.rec-tag{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--accent)}
.rec-tag::before{content:"✦ "}
.kc-rec p{font-size:14px; line-height:1.55}
.kc-chart{padding:6px 0}
.kc-bars{height:120px}
.audit{list-style:none; margin:10px 0 0; padding:0; display:grid}
.audit li{padding:10px 0; border-top:1px solid var(--rule); display:grid; gap:6px; font-size:13.5px}
.audit td.old{color:var(--muted); text-decoration:line-through}
.kc-angle,.kc-quote{margin:4px 0}
/* prospekter */
.prosp .pside{position:sticky; top:90px; max-height:calc(100vh - 106px); overflow:auto; padding-right:2px}
.prosp .li.sel{background:var(--sel); box-shadow:inset 3px 0 0 var(--accent)}
.prosp .li.sel .t{color:var(--accent)}
.pscore.sm{font-size:13px; min-width:30px; text-align:center; padding:1px 0; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--rule); color:var(--ink)}
.sx{border:1px solid var(--rule); border-radius:var(--r); padding:8px 10px}
.sx summary{cursor:pointer; display:flex; align-items:center; gap:10px; flex-wrap:wrap; list-style:none}
.sx summary::-webkit-details-marker{display:none}
.sx-n{font-size:20px; font-weight:700; min-width:40px; text-align:center; border-radius:var(--r-sm); background:var(--surface-2); padding:2px 6px}
.sx summary u{color:var(--accent); text-underline-offset:2px}
.sx-why{flex-basis:100%; font-size:12.5px; color:var(--muted)}
.sx[open] summary{margin-bottom:8px}
.src{font-size:11px; font-weight:600; padding:0 6px; border-radius:var(--r-sm); border:1px solid var(--rule); white-space:nowrap}
.src.crm{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.src.open{background:var(--info-soft); color:var(--info); border-color:transparent}
.src.inf{background:var(--surface-2); color:var(--muted)}
.src.ai{background:var(--violet-soft); color:var(--violet); border-color:transparent}
.score,.why{display:none}
.gcard{border-top:0; border:1px dashed var(--rule-2); box-shadow:none; background:var(--surface-2)}
.gcard::before{content:"Kandidat · ikke i CRM"; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--violet)}
/* pipeline */
.board{grid-template-columns:repeat(7,minmax(190px,1fr)); gap:0; border:1px solid var(--rule); border-radius:var(--r); background:var(--surface); overflow-x:auto; padding:0}
.col{background:transparent; border:0; border-left:1px solid var(--rule); border-radius:0; padding:0; min-height:360px; gap:0}
.col:first-child{border-left:0}
.col>header{padding:10px 10px 8px; border-bottom:1px solid var(--rule); border-top:3px solid var(--c); background:var(--surface-2); position:sticky; top:0; gap:2px}
.col .ch{display:flex; justify-content:space-between; align-items:center; gap:6px}
.col .ch .st{font-size:13px; font-weight:700; color:var(--ink)}
.col .ch .st::before{display:none}
.col .cn{font-size:12px; font-weight:700; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-sm); padding:0 6px}
.col .cv{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.cards{display:grid; gap:6px; padding:8px}
.col-empty{font-size:12.5px; color:var(--muted); text-align:center; padding:14px 0}
.card{padding:8px 10px; gap:3px; border-radius:var(--r); box-shadow:none !important; border:1px solid var(--rule); transform:none !important}
.card:hover{border-color:var(--rule-2); background:var(--surface-2)}
.card:focus-visible{outline:2px solid var(--accent)}
.card .o{font-size:12px}
.card .m{font-size:12px}
.card .f{margin-top:2px}
.card .nx{font-size:12px; color:var(--muted); border-top:1px dashed var(--rule); padding-top:4px; margin-top:2px}
.card .nx.warn{color:var(--warn); font-weight:600} .card .nx.over{color:var(--danger); font-weight:600}
.card .cs{font-size:12px; font-weight:600; color:var(--info)} .card .cs.bad{color:var(--danger)}
.card.s-pending{border-style:dashed; border-color:var(--info)} .card.s-failed{border-color:var(--danger); background:var(--danger-soft)} .card.s-queued{border-style:dashed; border-color:var(--warn)}
.card.dragging{opacity:.4}
.board.dragging .col:not(.invalid) .cards{outline:1px dashed var(--rule-2); outline-offset:-4px}
.col.over .cards{background:var(--sel); outline:2px solid var(--accent) !important; outline-offset:-4px}
.col.invalid{cursor:not-allowed} .col.invalid .cards{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 8px)}
/* kalender */
.calt{font-size:19px; min-width:170px; text-align:center}
.cal{max-height:70vh; overflow:auto; border:1px solid var(--rule-2); border-radius:var(--r)}
.cal table{min-width:0; width:max-content; table-layout:fixed; border-collapse:separate; border-spacing:0; font-size:12px}
.cal th,.cal td{border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:0}
.cal thead th{position:sticky; top:0; z-index:3; background:var(--surface-2); width:58px; min-width:58px; font-size:12px; font-weight:600; color:var(--ink); text-transform:none; letter-spacing:0; padding:4px 0; text-align:center; line-height:1.2}
.cal thead th span{display:block; font-size:10.5px; font-weight:500; color:var(--muted); text-transform:uppercase}
.cal th.room{position:sticky; left:0; z-index:2; width:160px; min-width:160px; text-align:left; padding:6px 10px; background:var(--surface); font-weight:600; font-size:13px; color:var(--ink); text-transform:none; letter-spacing:0; border-right:1px solid var(--rule-2)}
.cal thead th.room{z-index:4; background:var(--surface-2)}
.cal th.room span{display:block; font-size:11.5px; color:var(--muted); font-weight:400}
.cal td.day{height:44px; background:var(--surface)}
.cal td.we,.cal thead th.we{background:#ECECE5}
.cal td.today{background:var(--sel)}
.cal thead th.today{background:var(--accent); color:var(--accent-ink)} .cal thead th.today span{color:var(--accent-ink)}
.cal thead th.seld{box-shadow:inset 0 -3px 0 var(--accent)}
.cal td.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal td.day button{all:unset; cursor:pointer; display:block; width:100%; height:100%; box-sizing:border-box; padding:4px 3px}
.cal td.day button:hover{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.cal td.day button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.cal .bk{position:static; display:block; height:100%; box-sizing:border-box; border-radius:var(--r-sm); padding:3px 4px; font-size:11px; font-weight:600; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; place-items:initial}
.cal .bk.bekreftet{background:var(--accent); color:var(--accent-ink)}
.cal .bk.holdt{background:var(--warn); color:#fff}
.cal .bk.tilbud,.cal .bk.visning,.cal .bk.dialog,.cal .bk.ny{background:var(--info-soft); border:1.5px dashed var(--info); color:var(--info)}
.cal tr.sep th.room{background:var(--surface-2); font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); padding:4px 10px}
.cal tr.sep td{height:22px; background:var(--surface-2)}
.lg{display:inline-block; width:16px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px}
.lg.bekreftet{background:var(--accent)} .lg.holdt{background:var(--warn)} .lg.dialog{background:var(--info-soft); border:1.5px dashed var(--info)} .lg.we{background:#ECECE5; border:1px solid var(--rule)} .lg.today{background:var(--sel); border:1px solid var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cal td.we, :root:not([data-theme="light"]) .cal thead th.we, :root:not([data-theme="light"]) .lg.we{background:#20261C} }
/* statistikk */
.sgb .t i{background:color-mix(in srgb,var(--accent) 70%,var(--surface)) !important}
.sgb.on .t i{background:var(--accent) !important}
.ybars{height:150px}
/* tilbud */
.rc.on{background:var(--sel); box-shadow:inset 0 0 0 2px var(--accent)}
.rc-sel{font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.06em}
.qside{position:sticky; top:90px}
.qd-lines tr.gh th{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:12px 0 4px; text-align:left; background:transparent; border:0; position:static}
.qd-lines tr.disc td{color:var(--accent)}
.qd-lines tr.req td{font-size:11.5px; color:var(--warn); padding:0 0 6px; border-bottom:1px dashed var(--rule)}
.qd-lines tfoot tr.sub td{font-family:var(--sans); font-size:14px; font-weight:600; padding-top:10px; border-top:1px solid var(--rule-2)}
.qd-lines tfoot tr.vat td{font-family:var(--sans); font-size:12px; font-weight:400; color:var(--muted); padding:2px 0 8px}
.qd-lines tfoot tr.tot td{font-size:22px; font-weight:700; padding-top:8px; border-top:2px solid var(--ink)}
/* generert innhold */
.gen-box{border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
/* data og oppsett */
.dwrap{display:grid; grid-template-columns:210px minmax(0,1fr); gap:16px; align-items:start}
.dnav{display:grid; gap:2px; position:sticky; top:90px}
.dnav button{all:unset; cursor:pointer; padding:7px 10px; border-radius:var(--r); font-size:13.5px; color:var(--muted); display:flex; justify-content:space-between; gap:8px}
.dnav button:hover{background:var(--surface)}
.dnav button[aria-current]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:inset 3px 0 0 var(--accent)}
.dnav button.fare{margin-top:12px; color:var(--danger)}
.dbody{gap:14px}
.sub3{font-family:var(--sans); font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-top:12px}
.steps{list-style:none; display:flex; flex-wrap:wrap; gap:4px; margin:0; padding:0; counter-reset:s}
.steps li{counter-increment:s; font-size:12.5px; padding:4px 10px 4px 8px; border-radius:var(--r-sm); background:var(--surface-2); color:var(--muted)}
.steps li::before{content:counter(s)". "; font-weight:700}
.steps li[aria-current]{background:var(--accent); color:var(--accent-ink); font-weight:600}
.steps li.done{color:var(--accent)}
.st-ok{color:var(--accent); font-weight:600} .st-warn{color:var(--warn); font-weight:600} .st-err{color:var(--danger); font-weight:600}
tr.bad td{background:var(--danger-soft)}
.ist{font-size:12px; font-weight:700; padding:1px 8px; border-radius:var(--r-sm); white-space:nowrap}
.ist.ok{background:var(--accent-soft); color:var(--accent)} .ist.auth,.ist.cfg{background:var(--warn-soft); color:var(--warn)} .ist.proto{background:var(--info-soft); color:var(--info)} .ist.off{background:var(--surface-2); color:var(--muted); border:1px solid var(--rule)}
.ist::before{content:"● "} .ist.off::before{content:"○ "}
td.s2{font-size:12.5px; color:var(--muted)}
.dup{border-top:1px solid var(--rule); padding:10px 0; display:grid; gap:6px}
.danger{border:1px solid color-mix(in srgb,var(--danger) 40%,transparent); border-radius:var(--r); padding:12px 14px; display:grid; gap:8px}
.cnt3:empty{display:none}
.dnav .cnt3{margin-left:auto}
.arch td,.arch th{vertical-align:top}
